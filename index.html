<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Classeur cyber d'Arnaud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Mise en page : un classeur, avec les intercalaires par module à gauche et la fiche de cours à droite sur papier quadrillé */
:root {
  --papier: #f6f7f9;
  --feuille: #ffffff;
  --encre: #1b2233;
  --doux: #5b6478;
  --trait: #dfe3ea;
  --grille: rgba(37, 71, 208, .05);
  --accent: #2547d0;
  --accent-fond: #e8edff;
  --piege: #b4540a;
  --piege-fond: #fff3e6;
  --ok: #1d7a4f;
  --ok-fond: #e6f5ec;
  --terminal: #141a26;
  --terminal-texte: #d7e0f0;
  --terminal-note: #f2b766;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --texte: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #10141d; --feuille: #171c28; --encre: #e4e8f2; --doux: #9aa3b8; --trait: #2a3142;
    --grille: rgba(140, 165, 255, .05); --accent: #8ea6ff; --accent-fond: #1f2848;
    --piege: #f2a65a; --piege-fond: #2e2114; --ok: #5fd39a; --ok-fond: #14291f;
    --terminal: #0b0e15; --terminal-texte: #d7e0f0; --terminal-note: #f2b766;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #10141d; --feuille: #171c28; --encre: #e4e8f2; --doux: #9aa3b8; --trait: #2a3142;
  --grille: rgba(140, 165, 255, .05); --accent: #8ea6ff; --accent-fond: #1f2848;
  --piege: #f2a65a; --piege-fond: #2e2114; --ok: #5fd39a; --ok-fond: #14291f;
  --terminal: #0b0e15; --terminal-texte: #d7e0f0; --terminal-note: #f2b766;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--papier); color: var(--encre);
  font: 16px/1.6 var(--texte);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.classeur { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 780px) { .classeur { grid-template-columns: minmax(0, 1fr); } }

/* Intercalaires */
.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 18px; align-content: start;
  max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--doux) transparent; }
.sommaire::-webkit-scrollbar { width: 6px; }
.sommaire::-webkit-scrollbar-thumb { background: var(--doux); border-radius: 3px; }
@media (max-width: 780px) { .sommaire { position: static; max-height: none; overflow: visible; } }
.marque { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.15; letter-spacing: -.01em; }
.marque small { display: block; font-family: var(--texte); font-weight: 400; font-size: .82rem; color: var(--doux); letter-spacing: 0; margin-top: 4px; }
.module { display: grid; gap: 6px; }
.module h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--doux); margin: 0; font-weight: 600; }
.module a, .module span.avenir {
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--encre); font-size: .95rem;
}
.module a:hover { background: var(--accent-fond); }
.module a[aria-current="page"] { background: var(--accent); color: var(--feuille); font-weight: 600; }
.module span.avenir { color: var(--doux); font-style: italic; }
/* Sommaire en dossiers repliables (demande d'Arnaud, 14/11/2026) */
details.dossier > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; user-select: none; }
details.dossier > summary::-webkit-details-marker { display: none; }
details.dossier > summary::before { content: ""; width: 7px; height: 7px; flex: none; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; opacity: .7; }
details.dossier[open] > summary::before { transform: rotate(45deg); }
details.dossier > summary:hover { background: var(--accent-fond); }
details.dossier > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dossier-titre { flex: 1; }
.compte { font: 600 .68rem var(--mono); color: var(--doux); }
details.module > summary .dossier-titre { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--doux); font-weight: 600; }
details.partie > summary .dossier-titre { font-size: .8rem; font-weight: 600; color: var(--encre); }
.dossier-contenu { display: grid; gap: 4px; margin: 4px 0 0 8px; padding-left: 8px; border-left: 1px solid var(--trait, rgba(127,127,127,.25)); }
details.partie { margin-top: 4px; }
.niv { font: 600 .7rem var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; opacity: .8; }

/* Fiche */
.fiche {
  background-color: var(--feuille);
  background-image: linear-gradient(var(--grille) 1px, transparent 1px), linear-gradient(90deg, var(--grille) 1px, transparent 1px);
  background-size: 22px 22px;
  border: 1px solid var(--trait); border-radius: 10px;
  padding: clamp(20px, 4vw, 44px);
  display: grid; gap: 30px; min-width: 0;
}
.entete { display: grid; gap: 10px; border-bottom: 2px solid var(--encre); padding-bottom: 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font: .8rem var(--mono); color: var(--doux); }
.meta b { color: var(--accent); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.regle {
  font-family: var(--display); font-weight: 600; font-size: clamp(1.2rem, 2.6vw, 1.5rem); line-height: 1.35;
  background: var(--accent-fond); border-left: 5px solid var(--accent); padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 0;
}
.regle span { display: block; font: 600 .72rem var(--texte); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }
section { display: grid; gap: 12px; min-width: 0; }
h3 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h3 .num { font: 600 .8rem var(--mono); color: var(--accent); }
p { margin: 0; max-width: 68ch; }
.deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }

pre {
  margin: 0; background: var(--terminal); color: var(--terminal-texte); font: .86rem/1.55 var(--mono);
  padding: 16px 18px; border-radius: 8px; overflow-x: auto; white-space: pre;
}
pre .n { color: var(--terminal-note); }
pre .c { color: #7f8aa3; }
pre .p { color: #8ea6ff; }

.pieges { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.pieges li { background: var(--piege-fond); border-left: 4px solid var(--piege); padding: 10px 14px; border-radius: 0 6px 6px 0; }
.pieges li b { color: var(--piege); }
.pieges.essentiels li { background: var(--accent-fond, transparent); border-left-color: var(--accent); }
.pieges.essentiels li b { color: var(--accent); }
.jourj { display: grid; gap: 8px; padding-left: 22px; margin: 0; }

.enplus { border: 1px dashed var(--trait); border-radius: 8px; padding: 14px 18px; display: grid; gap: 8px; background: var(--feuille); }
.enplus h4 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--doux); }

.questions { display: grid; gap: 10px; }
details { border: 1px solid var(--trait); border-radius: 8px; background: var(--feuille); }
summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reponse { padding: 0 16px 14px 36px; color: var(--encre); }
.reponse::before { content: "Réponse"; display: block; font: 600 .7rem var(--texte); text-transform: uppercase; letter-spacing: .1em; color: var(--ok); margin-bottom: 4px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.dessin { overflow-x: auto; background: var(--feuille); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; color: var(--encre); }
.dessin svg { display: block; width: 100%; min-width: 560px; height: auto; font-family: var(--texte); }
.dessin svg.petit { min-width: 420px; max-width: 620px; margin: 0 auto; }
img.illus { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--trait); background: #fff; }
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.photo { display: grid; gap: 4px; align-content: start; min-width: 0; }
.photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--trait); }
.photo b { font-size: .9rem; }
.photos.bd { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.photo small { font-size: .75rem; color: var(--doux); }
figcaption { font-size: .88rem; color: var(--doux); max-width: 70ch; }
.liens { font-size: .9rem; color: var(--doux); border-top: 1px solid var(--trait); padding-top: 16px; }
code { font: .9em var(--mono); background: var(--accent-fond); padding: 1px 5px; border-radius: 4px; }
/* Agrandir une image ou un schéma (demande d'Arnaud, 11/11/2026 : les détails sont difficiles à lire sur la fiche) */
.zoomable { cursor: zoom-in; }
dialog.loupe { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
dialog.loupe::backdrop { background: rgba(10, 12, 20, .88); }
.loupe-in { width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto; gap: 10px; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; cursor: zoom-out; }
.loupe-img { min-height: 0; display: grid; place-items: center; overflow: auto; }
.loupe-img img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; background: #fff; }
.loupe-img .dessin { width: min(1400px, 100%); max-height: 100%; overflow: auto; }
.loupe-img .dessin svg { min-width: 900px; }
.loupe-txt { color: #eef0f6; font-size: .95rem; max-width: 80ch; margin: 0 auto; text-align: center; }
.loupe-fermer { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: 16px; border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 22px; background: #fff; color: #161e33; cursor: pointer; }
/* À savoir par cœur : un intercalaire à part, un sous-dossier par module (demande d'Arnaud, 12/11/2026) */
.module.coeur { background: var(--ok-fond); border-radius: 8px; padding: 10px 8px 8px; }
.module.coeur h2 { color: var(--ok); padding-left: 2px; }
.module.coeur a[aria-current="page"], .module a.lien-coeur[aria-current="page"] { background: var(--ok); }
.module a.lien-coeur { color: var(--ok); font-size: .88rem; }
.module a.lien-coeur:hover { background: var(--ok-fond); }
.pc-barre { display: flex; flex-wrap: wrap; gap: 10px; }
.pc-barre button { font: 600 .9rem var(--texte); padding: 9px 14px; border-radius: 6px; border: 1px solid var(--trait); background: var(--feuille); color: var(--encre); cursor: pointer; }
.pc-barre button[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--feuille); }
.pc-barre button:focus-visible, .pc-rep:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pc-liste { display: grid; gap: 34px; }
.pc-module { display: grid; gap: 18px; }
.pc-titre { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; border-bottom: 1px solid var(--trait); padding-bottom: 8px; font-family: var(--display); font-size: 1.4rem; }
.pc-titre a { color: var(--encre); text-decoration: none; }
.pc-titre a:hover { color: var(--accent); }
.pc-titre span { font: .8rem var(--mono); color: var(--doux); }
.pc-themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
.pc-theme { background: var(--feuille); border: 1px solid var(--trait); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.pc-theme h3 { font-size: 1.05rem; }
.pc-theme dl { margin: 0; display: grid; gap: 6px; }
.pc-ligne { display: grid; grid-template-columns: minmax(96px, 38%) minmax(0, 1fr); gap: 10px; align-items: baseline; border-top: 1px dashed var(--trait); padding-top: 6px; }
.pc-ligne:first-child { border-top: 0; padding-top: 0; }
.pc-ligne dt { font: 600 .9rem var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.pc-ligne dd { margin: 0; min-width: 0; }
.pc-rep { all: unset; display: block; font-size: .92rem; line-height: 1.45; cursor: default; border-radius: 4px; overflow-wrap: anywhere; }
.pc-liste.cache .pc-rep { cursor: pointer; color: transparent; background: var(--accent-fond); user-select: none; }
.pc-liste.cache .pc-rep::after { content: "toucher pour voir"; color: var(--doux); font-size: .78rem; font-style: italic; position: relative; }
.pc-liste.cache .pc-rep { position: relative; }
.pc-liste.cache .pc-rep::after { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); }
.pc-liste.cache .pc-rep.vu { color: var(--encre); background: var(--ok-fond); user-select: auto; }
.pc-liste.cache .pc-rep.vu::after { content: none; }
.pc-fiche { font-size: .85rem; color: var(--accent); text-decoration: none; justify-self: start; }
.pc-fiche:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="classeur">
  <nav class="sommaire" aria-label="Fiches">
    <div class="marque">Classeur cyber<small>Les fiches de cours d'Arnaud · objectif AIS 2027</small></div>
    <div id="intercalaires"></div>
  </nav>
  <main id="fiche" class="fiche"></main>
</div>

<script>
// Une fiche = un objet. Pour ajouter une leçon : ajouter un objet ici et republier.
const FICHES = [
  {
    id: "dns", module: "1 · Réseau", chapitre: "1.8", partie: "A", niveau: "M", titre: "Le DNS : du nom à l'adresse",
    date: "07/11/2026",
    regle: "Le DNS traduit un nom de domaine en adresse IP. Une question (« quelle est l'adresse de picard.fr ? »), une réponse : l'IP de la cible. Il ne s'occupe pas des ports.",
    figures: [{

      svg: `<svg viewBox="0 0 720 330" role="img" aria-label="Chemin d'une résolution DNS : le PC demande à la box, la box interroge la racine, le .fr puis le serveur DNS de picard.fr, renvoie l'IP au PC, qui contacte ensuite directement le site.">

    <rect x="480" y="268" width="220" height="50" rx="8" style="stroke:var(--accent)" stroke-width="2"/>
    <line x1="130" y1="126" x2="238" y2="126" marker-end="url(#fl-dns)"/>
    <line x1="370" y1="124" x2="478" y2="50" marker-end="url(#fl-dns)"/>

    <line x1="240" y1="154" x2="132" y2="154" stroke-dasharray="5 4" style="stroke:var(--accent)" stroke-width="2" marker-end="url(#fl-dns-a)"/>

    probleme: "Les ordinateurs ne se parlent qu'avec des adresses IP, c'est-à-dire des numéros. Les humains retiennent des noms. Sans DNS, il faudrait connaître 51.91.60.233 par cœur pour aller sur Picard.",
    analogie: "Le répertoire de contacts du téléphone : tu touches « Maman » et le téléphone compose le numéro. Le DNS est le répertoire d'internet, réparti sur des milliers de serveurs dans le monde.",

`<span class="p">PC 192.168.1.94</span> : « picard.fr ? »

    enplus: "<p><b>Le NAT, c'est l'accueil d'un hôtel.</b> Les chambres ont des numéros internes (les IP privées) ; l'hôtel a une seule adresse postale (l'IP publique). L'accueil (la box) met l'adresse de l'hôtel comme expéditeur sur chaque lettre et note dans un registre (la table NAT) quelle chambre a écrit à qui, grâce à un numéro de port. Quand la réponse arrive, il la remonte à la bonne chambre. Vérifié en séance : <code>curl.exe ifconfig.me</code> affiche l'adresse publique de la box, pas celle du PC. La box a deux faces : 192.168.1.254 dedans, l'IP publique dehors. Bonus sécurité : une connexion venue de dehors que personne n'a demandée n'est pas dans le registre, donc la box la jette.</p><p><b>✏️ Le NAT dans les deux sens (15/11), sur un exemple.</b></p><pre>                  SOURCE                        DESTINATION\nAller, avant      192.168.120.120 (téléphone)   142.250.x.x (YouTube)\nAller, après      88.12.34.56 (box, publique)   142.250.x.x          ← inchangée\nRetour, arrivée   142.250.x.x                   88.12.34.56 port 50000\nRetour, après     142.250.x.x                   192.168.120.120 port 51000\n\nTable NAT :  192.168.120.120 port 51000  ↔  88.12.34.56 port 50000</pre><p>À l'aller, le routeur remplace la <b>source</b> ; au retour, la <b>destination</b>. Entre les deux, sa table NAT, où chaque connexion a son propre port côté Internet : c'est le port qui retrouve le bon appareil. Les deux adresses du routeur (192.168.120.1 dedans, 88.12.34.56 dehors) ne changent jamais.</p><p><b>Pourquoi un serveur a aussi un nom ?</b> Un nom de domaine n'est qu'une étiquette posée sur une adresse IP, et n'importe quelle machine peut en avoir une. Les sites en sont l'usage le plus connu, mais les administrateurs nomment aussi leurs machines pour s'y retrouver : <code>eole2.iptwins.com</code>, c'est « la machine Eole n° 2 d'IP Twins ». Comme chez Picard, où le magasin a une enseigne pour les clients, mais où la chambre froide a aussi son étiquette pour les techniciens.</p>",

    enplus: "<p><b>Le lien sécurité.</b> Tout le HTML et le JS arrivent chez le client, qui peut tout lire (clic droit → Afficher le code source) : jamais de mot de passe ni de secret dedans, même en HTTPS (le HTTPS protège le trajet, pas le contenu une fois arrivé). Le JS est le vecteur des attaques XSS (OWASP Top 10, à venir). Dans les journaux d'un serveur, une rafale de 404 depuis la même IP (/admin, /.env, /backup.zip…) est la signature d'un outil d'énumération comme Gobuster : un analyste SOC repère ce motif, et cherche surtout le 200 qui le suit.</p><p><b>✏️ La poignée de main TCP (12/11).</b> Avant tout GET, TCP ouvre la ligne en trois messages : SYN, SYN-ACK, ACK. Elle vérifie que les deux machines s'entendent dans les deux sens avant d'envoyer des données : c'est ce qui rend TCP fiable. C'est elle, la « connexion au port 443 » (ou 80) de l'ordre d'une requête. En HTTPS, un court échange de plus met en place le chiffrement avant le GET (à voir plus tard). Le serveur reconnaît chaque connexion par quatre éléments ensemble : IP et port du client, IP et port du serveur. Deux PC peuvent donc utiliser le même port client. Derrière une box, c'est le NAT qui donne à chaque connexion son propre port côté Internet.</p><p><b>Niveaux.</b> Rôle client/serveur, GET/POST et familles de codes : Maîtriser (question classique d'admission). Écrire du HTML/CSS : à déléguer à l'IA, mais il faut savoir le lire et repérer ce qui cloche.</p>",

    probleme: "À l'intérieur d'une rue, il faut remettre chaque message à la bonne maison sans déranger les autres : c'est le travail du switch. Mais il ne sait pas sortir de la rue. Pour aller vers une autre rue, un autre réseau ou Internet, il faut un appareil qui relie des réseaux différents : le routeur.",
    analogie: "Le postier. La rue = le réseau. Le facteur de la rue = le switch (il ne quitte jamais sa rue). Le bureau de poste au bout de la rue = le routeur, la passerelle. L'adresse sur l'enveloppe = l'adresse IP de destination. La consigne du postier (« la rue, ce sont les 3 premiers nombres ») = le masque. L'annuaire = le DNS.",

`<span class="p">Switch</span>      remet chaque paquet à la bonne machine, <span class="n">dans le même réseau</span>

<span class="p">Réseau</span> (sens IP) = les machines qui ont la même partie réseau → elles se parlent sans routeur

    pieges: [
      ["« Le switch distribue la connexion » ou « répartit la bande passante ».", "Phrase de publicité. Le switch transmet les messages (les paquets) : il détermine quel paquet va à quelle machine, dans le même réseau."],

    enplus: "<p><b>Pourquoi les entreprises ont plusieurs réseaux avec un seul abonnement Internet.</b> Un réseau n'est pas un abonnement : c'est un groupe d'adresses. On découpe souvent une entreprise en plusieurs réseaux (la compta, les ateliers, le Wi-Fi des clients) reliés par un routeur, pour la sécurité : un virus arrivé dans un réseau n'atteint pas directement les autres. C'est la base des VLAN, que tu verras plus tard.</p><p><b>✏️ Switch de couche 2 ou de couche 3 (12/11, TryHackMe Extending Your Network, tâche 5).</b> Le switch classique, de <b>couche 2</b>, se repère avec les <b>adresses MAC</b> et livre à la bonne prise, dans le même réseau. Le switch de <b>couche 3</b> fait la même chose <b>et route</b> entre des réseaux différents, grâce aux <b>adresses IP</b> : il a une adresse dans chaque réseau, et c'est lui, la passerelle de chaque PC. Ce n'est pas un routeur : le switch de couche 3 relie les services à l'intérieur de l'entreprise (beaucoup de prises, très rapide), le routeur est à la sortie vers Internet (NAT, opérateur, pare-feu). Les « couches », c'est le modèle OSI (étape 4). En résumé : PC → masque et passerelle (il décide) · switch couche 2 → MAC (il livre) · switch couche 3 ou routeur → IP (il route).</p>",

    jourJ: [
      "Lis toute la consigne d'une question avant d'écrire, et souligne ce qu'on te demande vraiment (un nom, une raison, un ordre ?).",
      "Dans Packet Tracer : écris ton plan d'adressage avant de câbler (PC, prises du routeur, passerelles), puis prouve que ça marche par un ping dans les deux sens.",
      "Pour « explique à un collègue » : trois phrases courtes, sans jargon inutile, mais avec le mot exact.",
      "Pour une panne : écris d'abord ton plan d'étages, arrête-toi au premier qui échoue, et dis ce qu'il prouve ET ce qu'il ne prouve pas.",
      "Tu bloques ? Passe à la suite et reviens-y. Garde cinq minutes à la fin pour relire chaque réponse en cherchant le mot flou."
    ],
    autotest: [
      ["En une phrase : qui décide qu'un paquet doit sortir du réseau, et grâce à quoi ?", "Le PC, en comparant les parties réseau des deux adresses grâce à son masque ; s'il sort, il le confie à sa passerelle."],
      ["Le PC voisin a Internet, pas celui de ton collègue. Que peux-tu dire, et que ne peux-tu pas dire ?", "Tout ce qui est partagé marche (switch, box, Internet). La panne est sur son poste : PC, câble ou port. Le témoin ne dit pas lequel : on reprend les étages par le bas."],
      ["Raconte le NAT en trois verbes.", "Remplacer (la source, à l'aller), noter (la connexion et son port dans la table), rendre (au retour, la destination redevient l'adresse privée)."],
      ["Pourquoi le serveur de YouTube ne connaît-il jamais la MAC de ton téléphone ?", "Une MAC ne sert que sur le réseau local, d'une étape à la suivante ; YouTube répond à l'adresse IP publique de la box."]
    ],
    liens: ["box", "routeur", "ip", "depanner"]
  }
];
const revId = r => r.id;

// Leçons prévues, affichées grisées dans le sommaire (plan du module validé par Arnaud le 14/11/2026)
const A_VENIR = [
  { module: "1 · Réseau", chapitre: "1.4", partie: "A", titre: "DHCP et ARP", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.5", partie: "A", titre: "Les sous-réseaux à la main", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.6", partie: "A", titre: "Les modèles OSI et TCP/IP", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.7", partie: "A", titre: "Ports, TCP et UDP", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.11", partie: "B", titre: "VLAN et routage entre VLAN", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.12", partie: "B", titre: "Plan d'adressage et routage statique", niveau: "M" },
  { module: "1 · Réseau", chapitre: "1.13", partie: "B", titre: "ACL et pare-feu (pfSense)", niveau: "C" },
  { module: "1 · Réseau", chapitre: "1.14", partie: "B", titre: "VPN et Wi-Fi d'entreprise", niveau: "C" },
  { module: "1 · Réseau", chapitre: "1.15", partie: "B", titre: "Redondance : OSPF, STP, HSRP", niveau: "C" }
];

// Sous-parties d'un module : une lettre → un intitulé (clé "numéro du module" + lettre)
const PARTIES = {
  "1A": "A. Les fondations",
  "1B": "B. Le réseau d'entreprise"
};
// Tri par numéro de chapitre : 1.2 avant 1.10 (comparaison nombre par nombre, pas en texte)
const ordreChapitre = (a, b) => {
  const x = (a.chapitre || "99").split(".").map(Number), y = (b.chapitre || "99").split(".").map(Number);
  return x[0] - y[0] || (x[1] || 0) - (y[1] || 0);
};
const titreNum = f => (f.chapitre ? f.chapitre + " · " : "") + f.titre;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const nbPoints = m => m.themes.reduce((s, t) => s + t.lignes.length, 0);
const cur = (id, actif) => id === actif ? ' aria-current="page"' : "";

function sommaire(actif) {
  const modules = {};
  FICHES.forEach(f => (modules[f.module] ||= []).push({ ...f, pret: true }));
  A_VENIR.forEach(f => (modules[f.module] ||= []).push(f));
  const total = PAR_COEUR.reduce((s, m) => s + nbPoints(m), 0);
  const parCoeur = `<div class="module coeur"><h2>À savoir par cœur</h2>
    <a href="#par-coeur"${cur("par-coeur", actif)}><span>Tous les modules</span><span class="niv">${total}</span></a>
    ${PAR_COEUR.map(m => `<a href="#${pcId(m.module)}"${cur(pcId(m.module), actif)}><span>Module ${esc(m.module)}</span><span class="niv">${nbPoints(m)}</span></a>`).join("")}</div>`;
  // Chaque module et chaque partie est un dossier qu'on ouvre ou ferme d'un clic (<details>).
  // Le dossier qui contient la fiche affichée s'ouvre toujours ; les autres gardent l'état choisi par Arnaud.
  const lien = f => f.pret
    ? `<a href="#${f.id}"${cur(f.id, actif)}><span>${esc(titreNum(f))}</span><span class="niv">${f.niveau}</span></a>`
    : `<span class="avenir"><span>${esc(titreNum(f))}</span><span class="niv">bientôt</span></span>`;
  const dossier = (cle, classe, titre, compte, contenu, contientActif, ouvertParDefaut) => {
    const ouvert = contientActif || (cle in dossiersOuverts ? dossiersOuverts[cle] : ouvertParDefaut);
    return `<details class="dossier ${classe}" data-cle="${cle}"${ouvert ? " open" : ""}><summary><span class="dossier-titre">${titre}</span><span class="compte">${compte}</span></summary><div class="dossier-contenu">${contenu}</div></details>`;
  };
  const reviser = REVISIONS.length ? `<div class="module coeur"><h2>Réviser un examen</h2>
    ${REVISIONS.map(r => `<a href="#${revId(r)}"${cur(revId(r), actif)}><span>${esc(r.examen)} · ${esc(r.quand.split(" à ")[0])}</span><span class="niv">★</span></a>`).join("")}</div>` : "";
  document.getElementById("intercalaires").innerHTML = reviser + parCoeur + Object.entries(modules).map(([m, liste]) => {
    const pc = PAR_COEUR.find(x => x.module === m);
    const num = m.split(" ")[0];
    const groupes = [];
    liste.sort(ordreChapitre).forEach(f => {
      const cle = num + (f.partie || "");
      if (!groupes.length || groupes[groupes.length - 1].cle !== cle) groupes.push({ cle, fiches: [] });
      groupes[groupes.length - 1].fiches.push(f);
    });
    const contenu = groupes.map(g => {
      const liens = g.fiches.map(lien).join("");
      if (!PARTIES[g.cle]) return liens;
      const prets = g.fiches.filter(f => f.pret).length;
      return dossier("p" + g.cle, "partie", esc(PARTIES[g.cle]), `${prets}/${g.fiches.length}`, liens,
        g.fiches.some(f => f.id === actif), g.fiches.some(f => f.pret));
    }).join("") + (pc ? `<a class="lien-coeur" href="#${pcId(m)}"${cur(pcId(m), actif)}><span>★ Par cœur de ce module</span><span class="niv">${nbPoints(pc)}</span></a>` : "");
    const prets = liste.filter(f => f.pret).length;
    return dossier("m" + num, "module", `Module ${esc(m)}`, `${prets}/${liste.length}`, contenu,
      liste.some(f => f.id === actif) || actif === pcId(m), true);
  }).join("");
}

// État des dossiers du sommaire (ouvert / fermé), gardé sur l'appareil
let dossiersOuverts = {};
try { dossiersOuverts = JSON.parse(localStorage.getItem("classeur-dossiers") || "{}"); } catch (e) {}
// Seul un clic d'Arnaud compte (pas l'ouverture automatique du dossier de la fiche affichée)
document.addEventListener("click", e => {
  const s = e.target.closest && e.target.closest("details.dossier > summary");
  if (!s) return;
  const d = s.parentElement;
  dossiersOuverts[d.dataset.cle] = !d.open;   // le clic va inverser l'état
  try { localStorage.setItem("classeur-dossiers", JSON.stringify(dossiersOuverts)); } catch (err) {}
});

// Mode révision : les réponses sont cachées, un clic en dévoile une (préférence gardée sur l'appareil).
let revision = false;
try { revision = localStorage.getItem("classeur-revision") === "1"; } catch (e) {}

function blocModule(m, seul) {
  const figures = (m.figures || []).map(g => `<figure><div class="dessin zoomable" tabindex="0" data-txt="${esc(g.legende)}">${g.svg}</div><figcaption>${esc(g.legende)}</figcaption></figure>`).join("");
  return `<section class="pc-module">
      ${seul ? "" : `<h2 class="pc-titre"><a href="#${pcId(m.module)}">Module ${esc(m.module)}</a><span>${nbPoints(m)} points · mis à jour le ${m.maj}</span></h2>`}
      ${figures}
      <div class="pc-themes">${m.themes.map(t => {
        const fiche = FICHES.find(f => f.id === t.fiche);
        return `<article class="pc-theme"><h3>${esc(t.titre)}</h3>
          <dl>${t.lignes.map(([k, v]) => `<div class="pc-ligne"><dt>${esc(k)}</dt><dd><button type="button" class="pc-rep" aria-label="Voir la réponse">${esc(v)}</button></dd></div>`).join("")}</dl>
          ${fiche ? `<a class="pc-fiche" href="#${fiche.id}">Fiche ${esc(titreNum(fiche))} →</a>` : ""}</article>`;
      }).join("")}</div>
      ${m.pieges && m.pieges.length ? `<section><h3>Tes pièges sur ce module</h3><ul class="pieges">${m.pieges.map(([t, d]) => `<li><b>${esc(t)}</b> ${esc(d)}</li>`).join("")}</ul></section>` : ""}
    </section>`;
}

function pageParCoeur(id) {
  const m = PAR_COEUR.find(x => pcId(x.module) === id);
  const liste = m ? [m] : PAR_COEUR;
  document.getElementById("fiche").innerHTML = `
    <header class="entete">
      <div class="meta"><span>À savoir par cœur</span><span>${m ? `Module <b>${esc(m.module)}</b>` : `<b>${PAR_COEUR.length}</b> module${PAR_COEUR.length > 1 ? "s" : ""}`}</span></div>
      <h1>${m ? `Par cœur · ${esc(m.module.split(" · ")[1] || m.module)}` : "À savoir par cœur"}</h1>
    </header>
    <p class="regle"><span>Comment s'en servir</span>Ce qui ne se déduit pas : on l'apprend, puis on le répète. Active le mode révision, dis chaque réponse à voix haute, puis touche-la pour vérifier. Une ligne ratée = un essai dans le Mémo le jour même.</p>
    <div class="pc-barre">
      <button type="button" id="pc-mode" aria-pressed="${revision}">${revision ? "Mode révision : réponses cachées" : "Mode révision : désactivé"}</button>
      <button type="button" id="pc-tout"${revision ? "" : " hidden"}>Tout dévoiler</button>
    </div>
    <div class="pc-liste${revision ? " cache" : ""}" id="pc-liste">${liste.map(x => blocModule(x, !!m)).join("")}</div>`;
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("#pc-mode, #pc-tout, .pc-rep");
  if (!b) return;
  const liste = document.getElementById("pc-liste");
  if (b.id === "pc-mode") {
    revision = !revision;
    try { localStorage.setItem("classeur-revision", revision ? "1" : "0"); } catch (err) {}
    b.setAttribute("aria-pressed", revision);
    b.textContent = revision ? "Mode révision : réponses cachées" : "Mode révision : désactivé";
    document.getElementById("pc-tout").hidden = !revision;
    liste.classList.toggle("cache", revision);
    liste.querySelectorAll(".vu").forEach(x => x.classList.remove("vu"));
  } else if (b.id === "pc-tout") {
    liste.querySelectorAll(".pc-rep").forEach(x => x.classList.add("vu"));
  } else {
    b.classList.toggle("vu");
  }
});

function pageRevision(r) {
  const fiches = r.liens.map(id => FICHES.find(f => f.id === id)).filter(Boolean);
  document.getElementById("fiche").innerHTML = `
    <header class="entete">
      <div class="meta"><span>Réviser un examen</span><span>Examen <b>${esc(r.examen)}</b> · ${esc(r.quand)}</span><span>Remise le ${r.remise}</span></div>
      <h1>${esc(r.examen)} · ${esc(r.titre)}</h1>
    </header>
    <p class="regle"><span>Le mot du prof</span>${esc(r.mot)}</p>
    <section><h3><span class="num">01</span>Ce que je veux t'entendre dire sans hésiter</h3>
      <ul class="pieges essentiels">${r.essentiels.map(([t, d]) => `<li><b>${esc(t)}.</b> ${esc(d)}</li>`).join("")}</ul></section>
    <section><h3><span class="num">02</span>Tes pièges à toi</h3>
      <ul class="pieges">${r.pieges.map(([t, d]) => `<li><b>${esc(t)}</b> ${esc(d)}</li>`).join("")}</ul></section>
    <section><h3><span class="num">03</span>Le jour J</h3>
      <ol class="jourj">${r.jourJ.map(t => `<li>${esc(t)}</li>`).join("")}</ol></section>
    <section><h3><span class="num">04</span>Quatre questions pour vérifier</h3>
      <p style="color:var(--doux)">À voix haute, avant d'ouvrir la réponse. Ce ne sont pas les questions de l'examen.</p>
      <div class="questions">${r.autotest.map(([q, rep], i) => `<details id="q-${r.id}-${i}"><summary>${esc(q)}</summary><div class="reponse">${esc(rep)}</div></details>`).join("")}</div></section>
    <p class="liens">Pour creuser un point : ${fiches.map(f => `<a href="#${f.id}">${esc(titreNum(f))}</a>`).join(" · ")} · <a href="#${pcId("1 · Réseau")}">★ À savoir par cœur</a></p>`;
  window.scrollTo(0, 0);
}

function afficher() {
  const id = location.hash.slice(1);
  if (id === "par-coeur" || id.startsWith("par-coeur-")) { sommaire(id); pageParCoeur(id); return; }
  const rev = REVISIONS.find(r => r.id === id);
  if (rev) { sommaire(id); pageRevision(rev); return; }
  const f = FICHES.find(x => x.id === id) || FICHES[FICHES.length - 1];
  sommaire(f.id);
  const niveaux = { M: "Maîtriser", C: "Comprendre", IA: "Déléguer à l'IA" };
  document.getElementById("fiche").innerHTML = `
    <header class="entete">
      <div class="meta"><span>Module ${esc(f.module)}</span>${f.chapitre ? `<span>Chapitre <b>${f.chapitre}</b></span>` : ""}<span>Niveau <b>${niveaux[f.niveau]}</b></span><span>Fiche du ${f.date}</span></div>
      <h1>${esc(f.titre)}</h1>
    </header>
    <p class="regle"><span>La règle</span>${esc(f.regle)}</p>
    <div class="deux">
      <section><h3><span class="num">01</span>Le problème</h3><p>${esc(f.probleme)}</p></section>
      <section><h3><span class="num">02</span>L'analogie</h3><p>${esc(f.analogie)}</p></section>
    </div>
    <section><h3><span class="num">03</span>Le schéma</h3>
      ${(f.figures || []).map(g => `<figure>${g.photos ? `<div class="photos${g.bd ? " bd" : ""}">${g.photos.map(p => `<div class="photo"><img class="zoomable" tabindex="0" src="${p.img}" alt="${esc(p.alt)}" data-txt="${esc(p.titre + (p.texte ? " · " + p.texte : ""))}" loading="lazy"><b>${esc(p.titre)}</b>${p.texte ? `<span style="font-size:.88rem">${esc(p.texte)}</span>` : ""}<small>${esc(p.credit)}</small></div>`).join("")}</div>` : g.img ? `<img class="illus zoomable" tabindex="0" src="${g.img}" alt="${esc(g.alt)}" data-txt="${esc(g.legende)}" loading="lazy">` : `<div class="dessin zoomable" tabindex="0" data-txt="${esc(g.legende)}">${g.svg}</div>`}<figcaption>${esc(g.legende)}</figcaption></figure>`).join("")}
      <pre>${f.schema}</pre></section>
    <section><h3><span class="num">04</span>Testé dans mon terminal</h3><pre>${f.exemple}</pre><p>${f.exempleNote}</p></section>
    <section><h3><span class="num">05</span>Les pièges</h3>
      <ul class="pieges">${f.pieges.map(([t, d]) => `<li><b>${esc(t)}</b> ${esc(d)}</li>`).join("")}</ul>
    </section>
    ${f.enplus ? `<aside class="enplus"><h4>Pour aller plus loin (vu en séance)</h4>${f.enplus}</aside>` : ""}
    <section><h3><span class="num">06</span>Teste-toi</h3>
      <p style="color:var(--doux)">Réponds à voix haute avant d'ouvrir la réponse.</p>
      <div class="questions">${f.questions.map(([q, r], i) =>
        `<details id="q-${f.id}-${i}"><summary>${esc(q)}</summary><div class="reponse">${esc(r)}</div></details>`).join("")}</div>
    </section>
    <p class="liens">${esc(f.liens)}${PAR_COEUR.some(x => x.module === f.module) ? ` <a href="#${pcId(f.module)}">★ À savoir par cœur pour ce module →</a>` : ""}</p>`;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", afficher);

// La loupe : un clic (ou Entrée) sur une image ou un schéma l'ouvre en grand ; un clic n'importe où, ou Échap, la ferme.
const loupe = document.createElement("dialog");
loupe.className = "loupe";
loupe.setAttribute("aria-label", "Image agrandie");
document.body.appendChild(loupe);
function ouvrirLoupe(el) {
  const contenu = el.tagName === "IMG" ? `<img src="${el.getAttribute("src")}" alt="${esc(el.alt)}">` : `<div class="dessin">${el.innerHTML}</div>`;
  loupe.innerHTML = `<button class="loupe-fermer" aria-label="Fermer">×</button><div class="loupe-in"><div class="loupe-img">${contenu}</div>${el.dataset.txt ? `<p class="loupe-txt">${esc(el.dataset.txt)}</p>` : ""}</div>`;
  loupe.showModal();
}
document.addEventListener("click", e => {
  if (loupe.open) { loupe.close(); return; }
  const z = e.target.closest(".zoomable"); if (z) ouvrirLoupe(z);
});
document.addEventListener("keydown", e => {
  const z = e.target.closest && e.target.closest(".zoomable");
  if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ouvrirLoupe(z); }
});
afficher();
</script>

</body>
</html>
